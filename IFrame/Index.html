<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://www.unpkg.com/@e-ra/widget-plugin@latest/dist/index.js"></script>
  <style>
    body {
      background: #1e1e2f;
      color: #00ffcc;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .value { font-size: 40px; font-weight: bold; }
    .unit { font-size: 20px; color: #ffffff; }
  </style>
</head>
<body>
  <div>ĐIỆN ÁP SOLAR</div>
  <div class="value"><span id="dien_ap">0.0</span> <span class="unit">V</span></div>

  <!-- Thẻ input để ERa map đúng biến -->
  <input type="hidden" id="v_solar">

  <script>
    const eraWidget = new EraWidget();
    eraWidget.init({
      onValues: (values) => {
        // Nhận dữ liệu điện áp từ ERa gửi sang
        if (values['v_solar']) {
          document.getElementById('dien_ap').innerText = parseFloat(values['v_solar'].value).toFixed(2);
        }
      }
    });
  </script>
</body>
</html>
